<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Статьи — Beengo Study</title>
<link rel="icon" href="assets/logo.svg">
<link rel="preload" as="font" type="font/woff2" href="assets/fonts/onest-cyrillic.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="assets/fonts/onest-latin.woff2" crossorigin>
<link rel="stylesheet" href="articles.css">
</head>
<body>
<header class="top"><div class="top-in">
  <a href="index.html"><img src="assets/logo.svg" alt="beengo"></a>
  <span class="sp"></span>
  <a class="back" href="index.html" data-t="toHome">← На главную</a>
  <a class="cta" href="index.html#lead" data-t="contact">Связаться с нами</a>
</div></header>

<main class="wrap">
  <nav class="crumbs"><a href="index.html" data-t="home">Главная</a><span>/</span><span data-t="arts">Статьи</span></nav>
  <h1 data-t="h1">Статьи о поступлении и жизни в Китае</h1>
  <p class="lead" data-t="lead">Коротко и по делу — о программах, документах, грантах и студенческой жизни.</p>
  <div class="filters" id="filters"></div>
  <div class="grid" id="grid"></div>
  <div class="pager" id="pager"></div>
</main>
<div class="foot" data-t="rights">Beengo Study. Все права защищены</div>

<script src="articles-data.js"></script>
<script>
const L=window.BEENGO_LANG,EN=L==='en';
const T=EN?{home:'Home',arts:'Articles',toHome:'← Home',allArts:'← All articles',contact:'Contact us',min:'min read',read:'Read article',all:'All',none:'No articles on this topic yet.',
  prev:'Back',next:'Next',toc:'Contents',q:'Any questions left?',qs:'We’ll review your situation in a free consultation.',consult:'Get a consultation',also:'Read also',allArr:'All articles →',
  h1:'Articles about admission and life in China',lead:'Short and to the point — about programs, documents, grants and student life.',rights:'Beengo Study. All rights reserved',listTitle:'Articles — Beengo Study'}
 :{home:'Главная',arts:'Статьи',toHome:'← На главную',allArts:'← Все статьи',contact:'Связаться с нами',min:'мин чтения',read:'Читать статью',all:'Все',none:'Пока нет статей в этой теме.',
  prev:'Назад',next:'Вперёд',toc:'Содержание',q:'Остались вопросы?',qs:'Разберём вашу ситуацию на бесплатной консультации.',consult:'Получить консультацию',also:'Читайте также',allArr:'Все статьи →',
  h1:'Статьи о поступлении и жизни в Китае',lead:'Коротко и по делу — о программах, документах, грантах и студенческой жизни.',rights:'Beengo Study. Все права защищены',listTitle:'Статьи — Beengo Study'};
const Q=EN?'?lang=en':'';
const A=window.beengoArticles(L),C=window.beengoCats(L);
document.documentElement.lang=L;
// шапка: переключатель языка и ссылки с сохранением языка
(()=>{const top=document.querySelector('.top-in');const lg=document.createElement('div');lg.className='lang';
  lg.innerHTML=`<button class="${EN?'':'on'}" data-l="ru">rus</button><button class="${EN?'on':''}" data-l="en">eng</button>`;
  top.insertBefore(lg,top.querySelector('.back'));lg.onclick=e=>{const b=e.target.closest('button');if(b&&b.dataset.l!==L)window.beengoSetLang(b.dataset.l)};
  document.querySelectorAll('[data-t]').forEach(el=>el.textContent=T[el.dataset.t]);
  document.querySelectorAll('a[href]').forEach(a=>{const h=a.getAttribute('href');if(EN&&/^(index|articles|article)\.html/.test(h))a.setAttribute('href',h.replace(/^([a-z]+\.html)/,'$1'+Q))});})();
const link=(page,hash)=>page+Q+(hash?'#'+hash:'');
const PER=3;document.title=T.listTitle;
let cat='all',page=1;
const card=a=>`<a class="card rv" href="${link('article.html',a.id)}">
  <div class="cover ${C[a.cat].cls}">${a.title}</div>
  <span class="cat ${a.cat}">${C[a.cat].name}</span>
  <h3>${a.title}</h3><p>${a.lead}</p>
  <div class="meta">${a.read} ${T.min}</div>
  <span class="more">${T.read}</span></a>`;
const f=document.getElementById('filters');
f.innerHTML=`<button data-c="all" class="on">${T.all}</button>`+Object.entries(C).map(([k,v])=>`<button data-c="${k}">${v.name}</button>`).join('');
f.onclick=e=>{const b=e.target.closest('button');if(!b)return;cat=b.dataset.c;page=1;[...f.children].forEach(x=>x.classList.toggle('on',x===b));render(true)};
function render(scroll){
  const list=A.filter(a=>cat==='all'||a.cat===cat);const pages=Math.max(1,Math.ceil(list.length/PER));page=Math.min(page,pages);
  document.getElementById('grid').innerHTML=list.slice((page-1)*PER,page*PER).map(card).join('')||`<p>${T.none}</p>`;
  const pg=document.getElementById('pager');
  pg.innerHTML=pages<2?'':`<button data-p="${page-1}" ${page===1?'disabled':''} aria-label="${T.prev}">←</button>`+
    Array.from({length:pages},(_,i)=>`<button data-p="${i+1}" class="${i+1===page?'on':''}">${i+1}</button>`).join('')+
    `<button data-p="${page+1}" ${page===pages?'disabled':''} aria-label="${T.next}">→</button>`;
  reveal();if(scroll)document.getElementById('filters').scrollIntoView({block:'start'});
}
document.getElementById('pager').onclick=e=>{const b=e.target.closest('button');if(!b||b.disabled)return;page=+b.dataset.p;render(true)};
function reveal(){const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.1});
  document.querySelectorAll('.rv:not(.in)').forEach((el,i)=>{el.style.transitionDelay=(i%3*0.08)+'s';io.observe(el)})}
render(false);
</script>
</body>
</html>
