<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Статьи — Beengo Study</title>
<link rel="icon" href="assets/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="articles.css">
</head>
<body>
<header class="top"><div class="top-in">
  <a href="index.html"><img src="assets/logo.svg" alt="beengo"></a>
  <span class="sp"></span>
  <a class="back" href="index.html">← На главную</a>
  <a class="cta" href="index.html#lead">Связаться с нами</a>
</div></header>

<main class="wrap">
  <nav class="crumbs"><a href="index.html">Главная</a><span>/</span><span>Статьи</span></nav>
  <h1>Статьи о поступлении и жизни в Китае</h1>
  <p class="lead">Коротко и по делу — о программах, документах, грантах и студенческой жизни.</p>
  <div class="filters" id="filters"></div>
  <div class="grid" id="grid"></div>
  <div class="pager" id="pager"></div>
</main>
<div class="foot">Beengo Study. Все права защищены</div>

<script src="articles-data.js"></script>
<script>
const A=window.BEENGO_ARTICLES,C=window.BEENGO_CATS,PER=3;
let cat='all',page=1;
const card=a=>`<a class="card rv" href="article.html#${a.id}">
  <div class="cover ${C[a.cat].cls}">${a.title}</div>
  <span class="cat ${a.cat}">${C[a.cat].name}</span>
  <h3>${a.title}</h3><p>${a.lead}</p>
  <div class="meta">${a.read} мин чтения</div>
  <span class="more">Читать статью</span></a>`;
const f=document.getElementById('filters');
f.innerHTML=`<button data-c="all" class="on">Все</button>`+Object.entries(C).map(([k,v])=>`<button data-c="${k}">${v.name}</button>`).join('');
f.onclick=e=>{const b=e.target.closest('button');if(!b)return;cat=b.dataset.c;page=1;[...f.children].forEach(x=>x.classList.toggle('on',x===b));render(true)};
function render(scroll){
  const list=A.filter(a=>cat==='all'||a.cat===cat);const pages=Math.max(1,Math.ceil(list.length/PER));page=Math.min(page,pages);
  document.getElementById('grid').innerHTML=list.slice((page-1)*PER,page*PER).map(card).join('')||'<p>Пока нет статей в этой теме.</p>';
  const pg=document.getElementById('pager');
  pg.innerHTML=pages<2?'':`<button data-p="${page-1}" ${page===1?'disabled':''} aria-label="Назад">←</button>`+
    Array.from({length:pages},(_,i)=>`<button data-p="${i+1}" class="${i+1===page?'on':''}">${i+1}</button>`).join('')+
    `<button data-p="${page+1}" ${page===pages?'disabled':''} aria-label="Вперёд">→</button>`;
  reveal();if(scroll)document.getElementById('filters').scrollIntoView({block:'start'});
}
document.getElementById('pager').onclick=e=>{const b=e.target.closest('button');if(!b||b.disabled)return;page=+b.dataset.p;render(true)};
function reveal(){const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.1});
  document.querySelectorAll('.rv:not(.in)').forEach((el,i)=>{el.style.transitionDelay=(i%3*0.08)+'s';io.observe(el)})}
render(false);
</script>
</body>
</html>
